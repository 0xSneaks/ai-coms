# Reusable CI for any 0xSneaks repo. Auto-detects Node / Python / Rust and
# runs whatever exists (lint, typecheck, test, build). Call it with
# devkit/templates/ci.yml. Pass `run` to replace auto-detect with your own command.
name: reusable-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "lts/*"
      python-version:
        type: string
        default: "3.12"
      run:
        description: Custom command; skips auto-detect when set
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect stack
        id: d
        run: |
          [ -f package.json ] && echo "node=1" >> "$GITHUB_OUTPUT" || true
          { [ -f pyproject.toml ] || [ -f requirements.txt ] || ls *.py >/dev/null 2>&1; } && echo "python=1" >> "$GITHUB_OUTPUT" || true
          [ -f Cargo.toml ] && echo "rust=1" >> "$GITHUB_OUTPUT" || true

      - name: Custom command
        if: inputs.run != ''
        env:
          CMD: ${{ inputs.run }}
        run: bash -c "$CMD"

      - uses: actions/setup-node@v4
        if: inputs.run == '' && steps.d.outputs.node
        with:
          node-version: ${{ inputs.node-version }}
      - name: Node
        if: inputs.run == '' && steps.d.outputs.node
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable; pm=pnpm; pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable; pm=yarn; yarn install --immutable || yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then pm=npm; npm ci
          else pm=npm; npm install; fi
          for s in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$s'] ? 0 : 1)"; then
              echo "::group::$pm run $s"; $pm run "$s"; echo "::endgroup::"
            fi
          done

      - uses: actions/setup-python@v5
        if: inputs.run == '' && steps.d.outputs.python
        with:
          python-version: ${{ inputs.python-version }}
      - name: Python
        if: inputs.run == '' && steps.d.outputs.python
        run: |
          python -m pip install -q --upgrade pip pytest
          [ -f requirements.txt ] && pip install -q -r requirements.txt
          [ -f pyproject.toml ] && pip install -q -e . || true
          set +e; python -m pytest -q; rc=$?; set -e
          [ "$rc" -eq 5 ] && { echo "no tests found"; rc=0; }
          exit "$rc"

      - name: Rust
        if: inputs.run == '' && steps.d.outputs.rust
        run: |
          cargo build --all-targets
          cargo test
